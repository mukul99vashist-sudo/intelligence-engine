name: Update India desk

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes, off the busy quarter-hours
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: update-desk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch headlines and analyse both desks
        run: node scripts/update.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save results
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "desk-bot"
            git config user.email "desk-bot@users.noreply.github.com"
            git add data
            git commit -m "Update India desk"
            git pull --rebase
            git push
          else
            echo "No changes"
          fi
